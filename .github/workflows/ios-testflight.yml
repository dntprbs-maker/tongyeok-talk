name: Build and upload iOS TestFlight
on:
  workflow_dispatch:
  push:
    branches: [codex/ios-web-shell-check-20261114]
    paths: [.github/workflows/ios-testflight.yml]
permissions:
  contents: read
jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin tag 3.47.8
          git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 737ba8f885dc774b53b442759999a312c9461e4e
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Prepare and test application
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
        run: |
          set -euo pipefail
          [[ "$GOOGLE_IOS_CLIENT_ID" =~ ^[a-zA-Z0-9-]+\.apps\.googleusercontent\.com$ ]]
          flutter create --platforms=ios --org com --project-name tongyeoktalk "$RUNNER_TEMP/tongyeok-app"
          cd "$RUNNER_TEMP/tongyeok-app"
          rm test/widget_test.dart
          cp "$GITHUB_WORKSPACE/pubspec.yaml" "$GITHUB_WORKSPACE/pubspec.lock" .
          cp -R "$GITHUB_WORKSPACE/assets" "$GITHUB_WORKSPACE/lib" "$GITHUB_WORKSPACE/test" .
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          client_id = os.environ["GOOGLE_IOS_CLIENT_ID"]
          path = Path("ios/Runner/Info.plist")
          with path.open("rb") as file:
              info = plistlib.load(file)
          info["CFBundleDisplayName"] = "통역톡"
          info["GIDClientID"] = client_id
          info.setdefault("CFBundleURLTypes", []).append({
              "CFBundleTypeRole": "Editor",
              "CFBundleURLSchemes": [
                  ".".join(reversed(client_id.split("."))),
              ],
          })
          with path.open("wb") as file:
              plistlib.dump(info, file)
          with Path("ios/Runner/Runner.entitlements").open("wb") as file:
              plistlib.dump({"com.apple.developer.applesignin": ["Default"]}, file)
          PY
          flutter pub get
          flutter test
      - name: Configure signing
        env:
          P12: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$P12" && test -n "$P12_PASSWORD" && test -n "$PROFILE"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/ci.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/ci.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/ci.keychain-db"
          security import "$RUNNER_TEMP/signing.p12" -k "$RUNNER_TEMP/ci.keychain-db" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/ci.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/ci.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" -o "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin:0' "$RUNNER_TEMP/profile.plist" | grep -Fx Default
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$UUID.mobileprovision"
      - name: Build signed app
        run: |
          cd "$RUNNER_TEMP/tongyeok-app"
          flutter build ios --release --no-codesign --build-number "$((1000 + GITHUB_RUN_NUMBER))"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          export PROFILE_NAME
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          project = path.read_text()
          bundle = "PRODUCT_BUNDLE_IDENTIFIER = com.tongyeoktalk;"
          assert bundle in project
          settings = (
              ' CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = 57QZYL899B;'
              ' CODE_SIGN_IDENTITY = "Apple Distribution";'
              ' CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;'
              f' PROVISIONING_PROFILE_SPECIFIER = "{os.environ["PROFILE_NAME"]}";'
          )
          path.write_text(project.replace(bundle, bundle + settings))
          PY
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Tongyeok.xcarchive" archive
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          with (Path(os.environ["RUNNER_TEMP"]) / "ExportOptions.plist").open("wb") as file:
              plistlib.dump({
                  "method": "app-store-connect",
                  "teamID": "57QZYL899B",
                  "signingStyle": "manual",
                  "signingCertificate": "Apple Distribution",
                  "provisioningProfiles": {"com.tongyeoktalk": os.environ["PROFILE_NAME"]},
              }, file)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Tongyeok.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload to TestFlight
        env:
          ASC_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY" && test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
