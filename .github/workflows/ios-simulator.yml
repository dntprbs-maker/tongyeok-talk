name: iOS simulator build

on:
  workflow_dispatch:
  push:
    branches: [codex/ios-web-shell-check-20261114]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Flutter at the tested revision
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin tag 3.47.8
          git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 737ba8f885dc774b53b442759999a312c9461e4e
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve packages
        run: |
          flutter create --platforms=ios --org com.tongyeoktalk --project-name tongyeok_shell "$RUNNER_TEMP/ios-shell"
          cp lib/main_web_shell.dart lib/mobile_web_navigation.dart lib/ios_reward_ad_probe.dart "$RUNNER_TEMP/ios-shell/lib/"
          mkdir -p "$RUNNER_TEMP/ios-shell/test"
          sed 's/package:bridgechat/package:tongyeok_shell/g' test/mobile_web_navigation_test.dart > "$RUNNER_TEMP/ios-shell/test/mobile_web_navigation_test.dart"
          cd "$RUNNER_TEMP/ios-shell"
          flutter pub add webview_flutter:4.14.1
          flutter pub add google_mobile_ads:9.2.0
          /usr/libexec/PlistBuddy -c 'Add :GADApplicationIdentifier string ca-app-pub-3940256099942544~1458002511' ios/Runner/Info.plist
      - name: Test web navigation rules
        run: cd "$RUNNER_TEMP/ios-shell" && flutter test test/mobile_web_navigation_test.dart
      - name: Build unsigned iOS simulator prototype
        run: cd "$RUNNER_TEMP/ios-shell" && flutter build ios --simulator --debug --no-codesign --dart-define=TONGYEOK_IOS_AD_PROBE=true -t lib/main_web_shell.dart
      - name: Start prototype in an iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if "iPhone" in d["name"]))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP="$RUNNER_TEMP/ios-shell/build/ios/iphonesimulator/Runner.app"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$DEVICE_ID" "$APP"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
