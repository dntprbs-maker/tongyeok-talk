name: iOS simulator build

on:
  workflow_dispatch:
    inputs:
      capture_store:
        description: Capture the real welcome screen on required iPhone and iPad simulators
        type: boolean
        default: false
      reuse_store_app:
        description: Reuse the verified simulator app to recapture an unobstructed iPhone screen
        type: boolean
        default: false
      audit_apple:
        description: Read existing Apple push capabilities only
        type: boolean
        default: false
  push:
    branches: [codex/ios-web-shell-check-20261114]

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.audit_apple && !inputs.capture_store }}
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Flutter at the tested revision
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin tag 3.47.8
          git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 737ba8f885dc774b53b442759999a312c9461e4e
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve packages
        run: |
          flutter create --platforms=ios --org com.tongyeoktalk --project-name tongyeok_shell "$RUNNER_TEMP/ios-shell"
          cp lib/main_web_shell.dart lib/mobile_web_navigation.dart lib/ios_reward_ad_probe.dart "$RUNNER_TEMP/ios-shell/lib/"
          cp lib/native_push_bridge_*.dart lib/firebase_options.dart "$RUNNER_TEMP/ios-shell/lib/"
          cp lib/native_reward_bridge_*.dart "$RUNNER_TEMP/ios-shell/lib/"
          mkdir -p "$RUNNER_TEMP/ios-shell/test"
          sed 's/package:bridgechat/package:tongyeok_shell/g' test/mobile_web_navigation_test.dart > "$RUNNER_TEMP/ios-shell/test/mobile_web_navigation_test.dart"
          sed 's/package:bridgechat/package:tongyeok_shell/g' test/native_push_bridge_protocol_test.dart > "$RUNNER_TEMP/ios-shell/test/native_push_bridge_protocol_test.dart"
          sed 's/package:bridgechat/package:tongyeok_shell/g' test/native_reward_bridge_protocol_test.dart > "$RUNNER_TEMP/ios-shell/test/native_reward_bridge_protocol_test.dart"
          cd "$RUNNER_TEMP/ios-shell"
          python3 -c 'from pathlib import Path; p=Path("pubspec.yaml"); s=p.read_text(); s=s.replace("  flutter:\n    sdk: flutter\n", "  flutter:\n    sdk: flutter\n  flutter_localizations:\n    sdk: flutter\n", 1); p.write_text(s)'
          flutter pub add webview_flutter:4.14.1
          flutter pub add google_mobile_ads:9.2.0
          flutter pub add firebase_core:3.15.2 firebase_messaging:15.2.10 shared_preferences:2.5.3
          /usr/libexec/PlistBuddy -c 'Add :GADApplicationIdentifier string ca-app-pub-7142914884555224~3669140398' ios/Runner/Info.plist
      - name: Test web navigation rules
        run: |
          node --test test/native_push_bridge_script.test.mjs test/native_reward_bridge_script.test.mjs
          cd "$RUNNER_TEMP/ios-shell"
          flutter test test/mobile_web_navigation_test.dart test/native_push_bridge_protocol_test.dart test/native_reward_bridge_protocol_test.dart
      - name: Build unsigned iOS simulator prototype
        run: cd "$RUNNER_TEMP/ios-shell" && flutter build ios --simulator --debug --no-codesign --dart-define=TONGYEOK_IOS_NATIVE_PUSH=true --dart-define=TONGYEOK_IOS_NATIVE_REWARDS=true --dart-define=TONGYEOK_ADS_TEST_MODE=true --dart-define=TONGYEOK_IOS_REWARD_BRIDGE_PROBE=true --dart-define=TONGYEOK_IOS_AD_PROBE=true --dart-define=TONGYEOK_IOS_AD_AUTO_TEST=true -t lib/main_web_shell.dart
      - name: Start prototype in an iPhone simulator
        timeout-minutes: 8
        run: |
          xcrun simctl list devices available > "$RUNNER_TEMP/ios-simulator-devices.txt"
          echo 'TT_SIM_STAGE=select_device'
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if "iPhone" in d["name"]))')
          xcrun simctl boot "$DEVICE_ID" || true
          echo 'TT_SIM_STAGE=boot_status'
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP="$RUNNER_TEMP/ios-shell/build/ios/iphonesimulator/Runner.app"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          echo 'TT_SIM_STAGE=install'
          xcrun simctl install "$DEVICE_ID" "$APP"
          echo 'TT_SIM_STAGE=launch'
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 45
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/ios-shell.png"
          perl -e 'alarm shift; exec @ARGV' 20 xcrun simctl spawn "$DEVICE_ID" log show --last 2m --style compact --predicate 'eventMessage CONTAINS "TT_IOS_"' > "$RUNNER_TEMP/ios-ad-log.txt" || true
          cat "$RUNNER_TEMP/ios-ad-log.txt"
          grep -q 'TT_IOS_NATIVE_REWARD_SAMPLE_EARNED_NO_CREDIT' "$RUNNER_TEMP/ios-ad-log.txt"
      - name: Preserve the test screen
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-shell-screen
          path: |
            ${{ runner.temp }}/ios-shell.png
            ${{ runner.temp }}/ios-ad-log.txt
            ${{ runner.temp }}/ios-simulator-devices.txt
          if-no-files-found: warn
          retention-days: 1
  apple-readiness:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.audit_apple }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ASC_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
      ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
    steps:
      - name: Read this app's capabilities and profile metadata
        run: |
          node --input-type=module <<'JS'
          import {sign} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          const encode = x => Buffer.from(JSON.stringify(x)).toString('base64url');
          async function read(path, query={}) {
            const now = Math.floor(Date.now()/1000);
            const input = encode({alg:'ES256',kid:process.env.ASC_KEY_ID,typ:'JWT'})+'.'+
              encode({iss:process.env.ASC_ISSUER_ID,iat:now,exp:now+300,aud:'appstoreconnect-v1'});
            const signature = sign('sha256',Buffer.from(input),{
              key:process.env.ASC_KEY,dsaEncoding:'ieee-p1363',
            }).toString('base64url');
            const url = new URL(path,'https://api.appstoreconnect.apple.com');
            if(url.origin!=='https://api.appstoreconnect.apple.com')throw Error('unexpected_origin');
            url.search = new URLSearchParams(query);
            const r = await fetch(url,{headers:{Authorization:'Bearer '+input+'.'+signature}});
            return r.ok ? {status:r.status,data:(await r.json()).data} : {status:r.status};
          }
          const bundle = await read('/v1/bundleIds',{'filter[identifier]':'com.tongyeoktalk'});
          const result = {checkedAt:new Date().toISOString(),readOnly:true,bundleStatus:bundle.status};
          if(bundle.data?.length===1 && bundle.data[0].attributes.identifier==='com.tongyeoktalk') {
            const id=bundle.data[0].id;
            const [caps,profiles]=await Promise.all([
              read('/v1/bundleIds/'+id+'/bundleIdCapabilities'),
              read('/v1/bundleIds/'+id+'/profiles',{'fields[profiles]':'name,profileState,profileType,expirationDate'}),
            ]);
            result.capabilitiesStatus=caps.status;
            result.capabilities=caps.data?.map(x=>x.attributes.capabilityType);
            result.profilesStatus=profiles.status;
            result.profiles=profiles.data?.map(x=>x.attributes);
          }
          console.log(JSON.stringify(result));
          writeFileSync(process.env.RUNNER_TEMP+'/apple-push-readiness.json',JSON.stringify(result,null,2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: apple-push-readiness
          path: ${{ runner.temp }}/apple-push-readiness.json
          retention-days: 1
  store-screens:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_store && !inputs.reuse_store_app }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tested Flutter
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin tag 3.47.8
          git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 737ba8f885dc774b53b442759999a312c9461e4e
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build the actual web shell for simulator capture
        run: |
          set -euo pipefail
          flutter create --platforms=ios --org com --project-name tongyeoktalk "$RUNNER_TEMP/store-app"
          cp lib/main_web_shell.dart lib/mobile_web_navigation.dart lib/ios_reward_ad_probe.dart "$RUNNER_TEMP/store-app/lib/"
          cp lib/native_push_bridge_*.dart lib/native_reward_bridge_*.dart lib/firebase_options.dart "$RUNNER_TEMP/store-app/lib/"
          cd "$RUNNER_TEMP/store-app"
          python3 -c 'from pathlib import Path; p=Path("pubspec.yaml"); p.write_text(p.read_text().replace("  flutter:\n    sdk: flutter\n", "  flutter:\n    sdk: flutter\n  flutter_localizations:\n    sdk: flutter\n", 1))'
          flutter pub add webview_flutter:4.14.1 google_mobile_ads:9.2.0 firebase_core:3.15.2 firebase_messaging:15.2.10 shared_preferences:2.5.3
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName 통역톡' ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :GADApplicationIdentifier string ca-app-pub-7142914884555224~3669140398' ios/Runner/Info.plist
          flutter build ios --simulator --debug --no-codesign -t lib/main_web_shell.dart
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app "$RUNNER_TEMP/store-simulator-app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: store-simulator-app
          path: ${{ runner.temp }}/store-simulator-app.zip
          retention-days: 1
      - name: Capture required device classes with no login or private data
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/store-screens"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/store-screens/devices.json"
          python3 - <<'PY' > "$RUNNER_TEMP/store-devices.txt"
          import json,os
          devices=[d for group in json.load(open(os.environ['RUNNER_TEMP']+'/store-screens/devices.json'))['devices'].values() for d in group]
          phone=next((d for name in ['iPhone 17 Pro','iPhone 16 Pro','iPhone 17','iPhone 16'] for d in devices if d['name']==name),None)
          tablet=next((d for d in devices if 'iPad Pro' in d['name'] and '13' in d['name']),None)
          assert phone and tablet, 'Required screenshot device unavailable'
          print('iphone '+phone['udid']); print('ipad '+tablet['udid'])
          PY
          APP="$RUNNER_TEMP/store-app/build/ios/iphonesimulator/Runner.app"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          while read -r LABEL DEVICE; do
            echo "TT_CAPTURE_STAGE=$LABEL:boot"
            xcrun simctl boot "$DEVICE"
            xcrun simctl bootstatus "$DEVICE" -b
            xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
            echo "TT_CAPTURE_STAGE=$LABEL:install"
            xcrun simctl install "$DEVICE" "$APP"
            echo "TT_CAPTURE_STAGE=$LABEL:launch"
            xcrun simctl launch "$DEVICE" "$BUNDLE"
            sleep 45
            xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/store-screens/$LABEL-welcome.png"
            xcrun simctl shutdown "$DEVICE"
          done < "$RUNNER_TEMP/store-devices.txt"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: tongyeok-store-screens
          path: ${{ runner.temp }}/store-screens
          if-no-files-found: warn
          retention-days: 3
  store-phone-recapture:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_store && inputs.reuse_store_app }}
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: store-simulator-app
          run-id: 44601106915
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/reuse
      - name: Capture unobstructed iPhone screen from the verified app
        timeout-minutes: 20
        run: |
          set -euo pipefail
          ditto -x -k "$RUNNER_TEMP/reuse/store-simulator-app.zip" "$RUNNER_TEMP/reuse"
          mkdir -p "$RUNNER_TEMP/store-phone"
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; ds=[d for group in json.load(sys.stdin)["devices"].values() for d in group]; print(next(d["udid"] for d in ds if d["name"]=="iPhone 17 Pro"))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          APP="$RUNNER_TEMP/reuse/Runner.app"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" "$BUNDLE"
          sleep 180
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/store-phone/iphone-welcome.png"
          xcrun simctl shutdown "$DEVICE"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: store-phone-unobstructed
          path: ${{ runner.temp }}/store-phone
          if-no-files-found: warn
          retention-days: 3
