name: iOS simulator build

on:
  workflow_dispatch:
    inputs:
      audit_apple:
        description: Read existing Apple push capabilities only
        type: boolean
        default: false
  push:
    branches: [codex/ios-web-shell-check-20261114]

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.audit_apple }}
    runs-on: macos-26-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Flutter at the tested revision
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin tag 3.47.8
          git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 737ba8f885dc774b53b442759999a312c9461e4e
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve packages
        run: |
          flutter create --platforms=ios --org com.tongyeoktalk --project-name tongyeok_shell "$RUNNER_TEMP/ios-shell"
          cp lib/main_web_shell.dart lib/mobile_web_navigation.dart lib/ios_reward_ad_probe.dart "$RUNNER_TEMP/ios-shell/lib/"
          cp lib/native_push_bridge_*.dart lib/firebase_options.dart "$RUNNER_TEMP/ios-shell/lib/"
          mkdir -p "$RUNNER_TEMP/ios-shell/test"
          sed 's/package:bridgechat/package:tongyeok_shell/g' test/mobile_web_navigation_test.dart > "$RUNNER_TEMP/ios-shell/test/mobile_web_navigation_test.dart"
          sed 's/package:bridgechat/package:tongyeok_shell/g' test/native_push_bridge_protocol_test.dart > "$RUNNER_TEMP/ios-shell/test/native_push_bridge_protocol_test.dart"
          cd "$RUNNER_TEMP/ios-shell"
          python3 -c 'from pathlib import Path; p=Path("pubspec.yaml"); s=p.read_text(); s=s.replace("  flutter:\n    sdk: flutter\n", "  flutter:\n    sdk: flutter\n  flutter_localizations:\n    sdk: flutter\n", 1); p.write_text(s)'
          flutter pub add webview_flutter:4.14.1
          flutter pub add google_mobile_ads:9.2.0
          flutter pub add firebase_core:3.15.2 firebase_messaging:15.2.10 shared_preferences:2.5.3
          /usr/libexec/PlistBuddy -c 'Add :GADApplicationIdentifier string ca-app-pub-3940256099942544~1458002511' ios/Runner/Info.plist
      - name: Test web navigation rules
        run: |
          node --test test/native_push_bridge_script.test.mjs
          cd "$RUNNER_TEMP/ios-shell"
          flutter test test/mobile_web_navigation_test.dart test/native_push_bridge_protocol_test.dart
      - name: Build unsigned iOS simulator prototype
        run: cd "$RUNNER_TEMP/ios-shell" && flutter build ios --simulator --debug --no-codesign --dart-define=TONGYEOK_IOS_NATIVE_PUSH=true --dart-define=TONGYEOK_IOS_AD_PROBE=true --dart-define=TONGYEOK_IOS_AD_AUTO_TEST=true -t lib/main_web_shell.dart
      - name: Start prototype in an iPhone simulator
        timeout-minutes: 8
        run: |
          xcrun simctl list devices available > "$RUNNER_TEMP/ios-simulator-devices.txt"
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if "iPhone" in d["name"]))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP="$RUNNER_TEMP/ios-shell/build/ios/iphonesimulator/Runner.app"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$DEVICE_ID" "$APP"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 45
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/ios-shell.png"
          perl -e 'alarm shift; exec @ARGV' 20 xcrun simctl spawn "$DEVICE_ID" log show --last 2m --style compact --predicate 'eventMessage CONTAINS "TT_IOS_AD_"' > "$RUNNER_TEMP/ios-ad-log.txt" || true
          cat "$RUNNER_TEMP/ios-ad-log.txt"
      - name: Preserve the test screen
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-shell-screen
          path: |
            ${{ runner.temp }}/ios-shell.png
            ${{ runner.temp }}/ios-ad-log.txt
            ${{ runner.temp }}/ios-simulator-devices.txt
          if-no-files-found: warn
          retention-days: 1
  apple-readiness:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.audit_apple }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ASC_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
      ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
    steps:
      - name: Read this app's capabilities and profile metadata
        run: |
          node --input-type=module <<'JS'
          import {sign} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          const encode = x => Buffer.from(JSON.stringify(x)).toString('base64url');
          async function read(path, query={}) {
            const now = Math.floor(Date.now()/1000);
            const input = encode({alg:'ES256',kid:process.env.ASC_KEY_ID,typ:'JWT'})+'.'+
              encode({iss:process.env.ASC_ISSUER_ID,iat:now,exp:now+300,aud:'appstoreconnect-v1'});
            const signature = sign('sha256',Buffer.from(input),{
              key:process.env.ASC_KEY,dsaEncoding:'ieee-p1363',
            }).toString('base64url');
            const url = new URL(path,'https://api.appstoreconnect.apple.com');
            if(url.origin!=='https://api.appstoreconnect.apple.com')throw Error('unexpected_origin');
            url.search = new URLSearchParams(query);
            const r = await fetch(url,{headers:{Authorization:'Bearer '+input+'.'+signature}});
            return r.ok ? {status:r.status,data:(await r.json()).data} : {status:r.status};
          }
          const bundle = await read('/v1/bundleIds',{'filter[identifier]':'com.tongyeoktalk'});
          const result = {checkedAt:new Date().toISOString(),readOnly:true,bundleStatus:bundle.status};
          if(bundle.data?.length===1 && bundle.data[0].attributes.identifier==='com.tongyeoktalk') {
            const id=bundle.data[0].id;
            const [caps,profiles]=await Promise.all([
              read('/v1/bundleIds/'+id+'/bundleIdCapabilities'),
              read('/v1/bundleIds/'+id+'/profiles',{'fields[profiles]':'name,profileState,profileType,expirationDate'}),
            ]);
            result.capabilitiesStatus=caps.status;
            result.capabilities=caps.data?.map(x=>x.attributes.capabilityType);
            result.profilesStatus=profiles.status;
            result.profiles=profiles.data?.map(x=>x.attributes);
          }
          console.log(JSON.stringify(result));
          writeFileSync(process.env.RUNNER_TEMP+'/apple-push-readiness.json',JSON.stringify(result,null,2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: apple-push-readiness
          path: ${{ runner.temp }}/apple-push-readiness.json
          retention-days: 1
